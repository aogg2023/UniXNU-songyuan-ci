name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG (SONGYUAN = Redmi K100 Pro Max, 4 KiB pages; PANDORA / FUXI / SWEET also build)
        default: SONGYUAN
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  # no push trigger: every run is started by hand (private-repo macOS minutes are limited)

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SONGYUAN' }}

jobs:
  build:
    # macos-14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    # (Xcode 16's iig emits IORPC.kernelContent, which this xnu lacks)
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
            # 按 series.songyuan 清单复制：blacktop 的 build.sh 会全量应用 *.patch，
            # 而 0102(pandora)/0124(pandora) 与我们 0103(songyuan) 改同一批行，必须排除。
            mkdir -p dxb/patches
            n=0
            while IFS= read -r f; do
            case "$f" in ''|'#'*) continue ;; esac
            cp "xnu/patches/$f" dxb/patches/ && n=$((n+1))
            done < xnu/patches/series.songyuan
            cp xnu/patches/*.sh dxb/patches/
            echo "copied $n patches from series.songyuan"
            test "$n" -ge 190 || { echo "series too short"; exit 1; }
          # The staging scripts only run for SWEET; FUXI and PANDORA use the same staged sources
          sed -i '' 's/\[\[ "${MACHINE_CONFIG:-}" == SWEET \]\]/[[ "${MACHINE_CONFIG:-}" =~ ^(SWEET|FUXI|PANDORA|SONGYUAN)$ ]]/' dxb/patches/*.sh
          grep -h 'MACHINE_CONFIG:-' dxb/patches/*.sh
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Package objects for local relinks
        if: always()
        run: |
          # Every object, file list and export list of the kernel link, plus the two link
          # libraries that only Xcode/blacktop have: wsl/local_relink.sh recompiles changed
          # files and relinks with cctools-port ld64 on Linux.
          O=dxb/build/xnu.obj
          mkdir -p linklibs
          cp dxb/fakeroot/usr/local/lib/kernel/libfirehose_kernel.a linklibs/ || true
          TC=$(dirname "$(xcrun --find clang)")/..
          find "$TC" "$(xcrun --sdk macosx --show-sdk-path)" -name '*cc_kext*' 2>/dev/null | tee linklibs/cc_kext_paths.txt
          while read -r f; do cp "$f" linklibs/ || true; done < linklibs/cc_kext_paths.txt
          (cd $O && find . -type f \( -name '*.o' -o -name '*.cpo' -o -name '*.filelist' -o -name '*.exp' -o -name 'symbolsets.plist' \)) > objlist.txt
          wc -l objlist.txt
          tar czf objects.tgz -C $O -T objlist.txt
          tar czf linklibs.tgz linklibs
          ls -la objects.tgz linklibs.tgz linklibs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-objects
          path: |
            objects.tgz
            linklibs.tgz
          retention-days: 7

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          # 只保留内核文件：.link 目录占 42 MB，本地调试用不到
          rm -rf out/kernel.*.link
          # 压缩内核：16 MB Mach-O 压完约 4-5 MB，下载时间从十几分钟降到几十秒
          for f in out/kernel.development.*; do [ -f "$f" ] && gzip -9 -k "$f"; done || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # 只有压缩后的内核（约 5 MB）：本地调试下这个，不要下 xnu-kernel
          name: xnu-kernel-gz
          path: out/kernel.*.gz
          if-no-files-found: warn

      - name: Build init ramdisk
        if: always()
        run: |
          set -euxo pipefail
          file tools/mini-init
          mkdir -p out
          rm -rf "$RUNNER_TEMP/rd.dmg" "$RUNNER_TEMP/rd_raw.dmg" "$RUNNER_TEMP/rd"
          mkdir -p "$RUNNER_TEMP/rd"
          # 裸卷（-layout NONE），catalog 节点强制 8 KiB（XNU 的 B-tree 代码按 8 KiB 处理）
          hdiutil create -size 128m -fs HFS+ -fsargs "-c 8192" -layout NONE -volname SONGYUAN -quiet "$RUNNER_TEMP/rd.dmg"
          hdiutil attach -nobrowse -noverify -mountpoint "$RUNNER_TEMP/rd" "$RUNNER_TEMP/rd.dmg"
          mkdir -p "$RUNNER_TEMP/rd/sbin"
          # arm64 XNU 要求 Mach-O 带代码签名，否则 exec 直接失败（OS_REASON_EXEC）
          codesign --force --sign - --timestamp=none tools/mini-init
          codesign --display --verbose=2 tools/mini-init 2>&1 | head -5 || true
          cp tools/mini-init "$RUNNER_TEMP/rd/sbin/launchd"
          chmod 755 "$RUNNER_TEMP/rd/sbin/launchd"
          ls -l "$RUNNER_TEMP/rd/sbin"
          sync
          hdiutil detach "$RUNNER_TEMP/rd"
          hdiutil convert "$RUNNER_TEMP/rd.dmg" -format UDRW -o "$RUNNER_TEMP/rd_raw"
          ls -l "$RUNNER_TEMP/rd_raw.dmg"
          # 探针：把卷参数写进一个小文件（不要用 assert 当探针，失败就看不到值了）
          python3 - "$RUNNER_TEMP/rd_raw.dmg" <<'PY'
          import struct, sys
          raw = open(sys.argv[1], "rb").read()
          sig = raw[1024:1026]
          bs = struct.unpack_from(">I", raw, 1024 + 40)[0]
          cat = raw[1024 + 272: 1024 + 272 + 80]
          start, bcnt = struct.unpack_from(">II", cat, 16)
          hdr = start * bs + 14
          depth, root, leafrec = struct.unpack_from(">HII", raw, hdr)
          node = struct.unpack_from(">H", raw, hdr + 18)[0]
          has_sbin = "sbin".encode("utf-16-le") in raw
          has_launchd = "launchd".encode("utf-16-le") in raw
          moff = raw.find(b"\xcf\xfa\xed\xfe")
          print(f"signature={sig} blockSize={bs} catalogNodeSize={node} treeDepth={depth} leafRecords={leafrec}")
          print(f"catalog_has_sbin={has_sbin} catalog_has_launchd={has_launchd} macho_magic_offset=0x{moff:x}")
          print(f"image_bytes={len(raw)}")
          PY
          python3 - "$RUNNER_TEMP/rd_raw.dmg" > out/ramdisk-info.txt <<'PY'
          import struct, sys
          raw = open(sys.argv[1], "rb").read()
          sig = raw[1024:1026].decode("latin1")
          bs = struct.unpack_from(">I", raw, 1024 + 40)[0]
          cat = raw[1024 + 272: 1024 + 272 + 80]
          start, bcnt = struct.unpack_from(">II", cat, 16)
          hdr = start * bs + 14
          node = struct.unpack_from(">H", raw, hdr + 18)[0]
          print(f"signature={sig}")
          print(f"blockSize={bs}")
          print(f"catalogNodeSize={node}")
          print(f"has_sbin={'sbin'.encode('utf-16-le') in raw}")
          print(f"has_launchd={'launchd'.encode('utf-16-le') in raw}")
          print(f"image_bytes={len(raw)}")
          PY
          cat out/ramdisk-info.txt
          gzip -9 -c "$RUNNER_TEMP/rd_raw.dmg" > out/ramdisk.img.gz
          ls -la out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-ramdisk
          path: |
            out/ramdisk.img.gz
            out/ramdisk-info.txt
          if-no-files-found: warn
